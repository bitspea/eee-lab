<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EEE U111 Virtual Lab Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
/* layout idea: one fixed-size bench "world" that zooms and scrolls, with a docked paper panel for the task */
:root{
  --bench:#4a5560; --bench-2:#414b55; --case:#e7e4dc; --case-2:#d3cfc4; --bezel:#23272c; --ink:#1c2328;
  --paper:#f6f4ee; --line:#d9d4c6; --accent:#e8862e; --ok:#2e8b57; --bad:#c0392b; --warn:#b97400; --muted:#69737b;
  --ui:"Barlow",system-ui,"Segoe UI",sans-serif; --cond:"Barlow Condensed","Arial Narrow",sans-serif; --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bench-2);color:var(--ink);font:14px/1.4 var(--ui);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%}
#bar{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--bezel);color:#eef1f3;flex-wrap:wrap}
#bar h1{font:700 17px var(--cond);letter-spacing:.06em;text-transform:uppercase;margin:0 8px 0 0;white-space:nowrap}
#bar .sp{flex:1}
#bar label{font-size:12px;color:#b9c2c9;display:flex;align-items:center;gap:6px}
#bar select,#bar button{background:#353b42;color:#eef1f3;border:1px solid #4b535b;border-radius:5px;padding:4px 9px;font-size:13px}
#bar button.on{background:var(--accent);border-color:var(--accent);color:#1b1206;font-weight:600}
#bar button:hover{border-color:#8b959d}
#main{flex:1;display:flex;min-height:0}
#viewport{flex:1;overflow:auto;position:relative;background:
  radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.07),transparent 60%),var(--bench)}
#sizer{position:relative}
#world{position:absolute;left:0;top:0;width:1546px;height:1116px;transform-origin:0 0;user-select:none;-webkit-user-select:none;touch-action:none}
#wiring{position:absolute;left:0;top:0;width:1546px;height:1116px;pointer-events:none;overflow:visible}
#wiring .hit{pointer-events:all;cursor:grab}
#wiring .board{pointer-events:all}
#wiring .hit[data-kind="cable"]{pointer-events:none}
#status{position:absolute;left:8px;bottom:6px;font-size:12px;color:#dfe5e9;background:rgba(20,24,28,.72);padding:3px 9px;border-radius:4px;pointer-events:none;z-index:5;max-width:70%}
#toasts{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:20;max-width:380px;pointer-events:none}
.toast{background:#23272c;color:#f3f5f6;border-left:5px solid var(--accent);padding:8px 12px;border-radius:5px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.35);pointer-events:auto}
.toast.bad{border-color:#ff5a47}.toast.ok{border-color:#54c986}
.toast b{display:block;font:600 13px var(--cond);letter-spacing:.05em;text-transform:uppercase;color:#ffc48a}
.toast.bad b{color:#ff9d90}.toast.ok b{color:#8fe3b3}
#tip{position:fixed;z-index:50;background:#111;color:#fff;font-size:12px;padding:3px 8px;border-radius:4px;pointer-events:none;display:none;white-space:nowrap}

/* instruments */
.inst{position:absolute;background:linear-gradient(#efece5,#dedad0);border:1px solid #9b978c;border-radius:9px;box-shadow:0 5px 0 #8f8b80,0 12px 22px rgba(0,0,0,.35);padding:8px 10px;font-family:var(--cond)}
.inst h2{margin:0 0 5px;font:700 13px var(--cond);letter-spacing:.09em;text-transform:uppercase;color:#30363b;display:flex;justify-content:space-between;gap:8px}
.inst h2 span{font-weight:500;color:#6c7479;letter-spacing:.04em}
.lbl{font:600 10.5px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:#3a4146;text-align:center;line-height:1.1}
.sock{display:inline-block;width:22px;height:22px;border-radius:50%;border:4px solid #c62f2f;background:radial-gradient(#050505 38%,#c8a44a 42%,#8c6d22 62%,#222 66%);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.sock.black{border-color:#1d1d1f}.sock.blue{border-color:#2457c5}.sock.green{border-color:#2f8f46}.sock.red{border-color:#c62f2f}
.bnc{display:inline-block;width:28px;height:28px;border-radius:50%;background:radial-gradient(#d9b55a 14%,#2b2b2b 18%,#2b2b2b 44%,#e3e5e8 48%,#9da2a8 70%,#6d7277 74%);box-shadow:0 1px 3px rgba(0,0,0,.5)}
.sock.snap,.bnc.snap{outline:3px solid #ffe14a;outline-offset:2px}
.key{background:linear-gradient(#fafafa,#cfd2d6);border:1px solid #7d8388;border-radius:4px;font:600 11px var(--cond);letter-spacing:.03em;padding:3px 5px;min-width:30px;color:#20262b;box-shadow:0 2px 0 #7d8388}
.key:active{transform:translateY(2px);box-shadow:none}
.key.dark{background:linear-gradient(#5b636b,#3c434a);color:#fff;border-color:#23282d;box-shadow:0 2px 0 #1e2327}
.key.lit{background:linear-gradient(#b9f3a8,#59c943);border-color:#2f7f22;box-shadow:0 0 8px #7dff62,0 2px 0 #2f7f22}
.key.lit.red{background:linear-gradient(#ffc0b5,#ee5a42);border-color:#9b2a18;box-shadow:0 0 8px #ff7a62,0 2px 0 #9b2a18}
.key.lit.amber{background:linear-gradient(#ffe6a8,#f0ae2e);border-color:#96640c;box-shadow:0 0 8px #ffc44a,0 2px 0 #96640c}
.key.y{border-bottom:3px solid #e3c400}.key.b{border-bottom:3px solid #2f8fe6}
.knob{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6a7178,#23272b 70%);box-shadow:0 3px 5px rgba(0,0,0,.5),inset 0 0 0 2px #15181b;position:relative;cursor:grab;touch-action:none;flex:none;margin:0 auto}
.knob.grab{cursor:grabbing}
.knob .cap{position:absolute;inset:5px;border-radius:50%;background:repeating-conic-gradient(#3a4046 0 6deg,#2a2f34 6deg 12deg)}
.knob .cap::after{content:"";position:absolute;left:50%;top:1px;width:3px;height:38%;margin-left:-1.5px;background:#fff;border-radius:2px}
.knob.sm{width:34px;height:34px}.knob.lg{width:54px;height:54px}
.knob.enc .cap::after{height:22%;background:#cfd6db}
.kn{display:flex;flex-direction:column;align-items:center;gap:3px}
.rocker{width:30px;height:46px;border-radius:5px;border:2px solid #15181b;background:linear-gradient(#3b4147 50%,#23272b 50%);color:#fff;font:700 12px var(--cond);display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding:0}
.rocker.on{background:linear-gradient(#c33 50%,#701414 50%);box-shadow:0 0 10px rgba(255,80,60,.7)}
.led{display:inline-block;width:9px;height:9px;border-radius:50%;background:#55595d;border:1px solid #2a2d30;vertical-align:middle}
.led.g.on{background:#48ef5c;box-shadow:0 0 7px #48ef5c}.led.r.on{background:#ff4a3a;box-shadow:0 0 7px #ff4a3a}
.led7{background:#160606;border:2px solid #0a0a0a;border-radius:4px;padding:3px 5px;height:38px;display:flex;align-items:center}
.seg7{height:100%;display:block}
.seg7 g{transform:skewX(-5deg);transform-origin:50% 100%}
.led7 .on{fill:#ff3b2b}.led7 .off{fill:#3a1010}
.led7.grn .on{fill:#5dff7a}.led7.grn .off{fill:#103216}
.row{display:flex;align-items:center;gap:6px}.col{display:flex;flex-direction:column;gap:5px}.grow{flex:1}
.socks{display:flex;gap:9px;justify-content:center;align-items:flex-end}
.socks>div{display:flex;flex-direction:column;align-items:center;gap:2px}
/* RPS */
#rps .body{display:flex;gap:8px;height:246px}
#rps .pw{width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#rps .ch{flex:1;background:#d5d1c6;border:1px solid #aaa598;border-radius:6px;padding:6px 7px;display:flex;flex-direction:column;justify-content:space-between}
#rps .ch{min-width:0}
#rps .ch.trk{flex:.8}
#rps .u{font:700 13px var(--cond);color:#333}
/* FG */
#fg .body{display:flex;gap:8px;height:246px}
#fgScreen{background:#0a1630;border:3px solid #15181b;border-radius:4px;display:block}
#fg .fcol{display:flex;flex-direction:column;justify-content:space-between;height:166px;padding:4px 0}
#fg .fcol .key{height:24px;min-width:34px}
#fg .pad{display:grid;grid-template-columns:repeat(3,34px);gap:5px}
/* DSO */
#dso .body{display:flex;gap:8px;height:386px}
#dsoScreen{background:#070b0e;border:3px solid #15181b;border-radius:4px;display:block}
#dso .fcol{position:relative;width:38px;height:384px;flex:none}
#dsoScreen,#fgScreen{flex:none}
#dso .bgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;flex:1}
#dso .bgrid .key{min-width:0;padding:3px 2px}
#dso .fcol .key{position:absolute;left:0;width:36px;height:26px}
#dso .ctl{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
#dso .grp{background:#d5d1c6;border:1px solid #aaa598;border-radius:6px;padding:4px 6px}
#dso .grp>.lbl{margin-bottom:3px}
/* handheld DMM */
#hdmm{background:linear-gradient(#f2b63a,#dc9a1c);border-color:#9a6a0b;box-shadow:0 5px 0 #8a5f09,0 12px 22px rgba(0,0,0,.35);border-radius:16px}
#hdmm .face{background:#2b2f33;border-radius:10px;padding:7px;height:100%;display:flex;flex-direction:column;gap:6px;color:#e9edf0}
#hdmm .lbl{color:#e9edf0}
.lcd{background:linear-gradient(#b9c4ad,#a7b39a);border:2px solid #14171a;border-radius:4px;height:62px;position:relative;padding:3px 6px;color:#1b211b;font:700 10px var(--cond)}
.lcd .seg7{height:40px;position:absolute;right:42px;bottom:4px}
.lcd .on{fill:#151a15}.lcd .off{fill:rgba(20,30,20,.08)}
.lcd .unit{position:absolute;right:6px;bottom:6px;font:700 17px var(--cond)}
.lcd .ann{display:flex;gap:7px;letter-spacing:.04em;height:12px}
.lcd .ann i{font-style:normal;opacity:.12}.lcd .ann i.on{opacity:1}
#hDial{width:128px;height:128px;margin:0 auto;position:relative;touch-action:none}
#hDial .ring{position:absolute;inset:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#737a82,#1c1f22 75%);box-shadow:0 3px 6px rgba(0,0,0,.6);cursor:grab}
#hDial .ptr{position:absolute;left:50%;top:50%;width:14px;height:42px;margin:-38px 0 0 -7px;background:#f1f3f4;border-radius:7px 7px 3px 3px;transform-origin:50% 38px;pointer-events:none}
#hDial .pos{position:absolute;font:700 10.5px var(--cond);color:#f1f3f4;transform:translate(-50%,-50%);cursor:pointer;padding:1px 2px;white-space:nowrap}
#hDial .pos.sel{color:#ffd24a}
.fuse{font:700 9px var(--cond);letter-spacing:.05em;border:1px solid #777;border-radius:3px;background:#3a3f44;color:#cfd5da;padding:1px 4px}
.fuse.blown{background:#b3261a;color:#fff;border-color:#ff8a7a;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
/* bench DMM */
#bdmm .body{display:flex;gap:10px;height:152px}
.vfd{background:#06110f;border:3px solid #15181b;border-radius:4px;width:286px;height:92px;position:relative;color:#69f5d2;font:600 11px var(--cond);padding:4px 8px}
.vfd .seg7{height:50px;position:absolute;left:8px;bottom:8px}
.vfd .on{fill:#69f5d2}.vfd .off{fill:#0d2a25}
.vfd .unit{position:absolute;right:10px;bottom:10px;font:700 22px var(--cond)}
.vfd .ann{display:flex;gap:9px;letter-spacing:.05em}
.vfd .ann i{font-style:normal;opacity:.14}.vfd .ann i.on{opacity:1}
#bdmm .keys{display:grid;grid-template-columns:repeat(5,44px);gap:6px 6px;align-content:center}
#bdmm .keys .key{height:26px;position:relative;margin-top:11px}
#bdmm .keys .key em{position:absolute;left:0;right:0;top:-12px;font:600 9.5px var(--cond);color:#1f62c6;font-style:normal}
/* DRB */
#drb .dials{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 6px}
.dd{display:flex;flex-direction:column;align-items:center;gap:1px}
.ddial{width:66px;height:66px;position:relative;touch-action:none;cursor:grab}
.ddial .cap{position:absolute;inset:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#666d74,#1c1f22 75%);box-shadow:0 2px 4px rgba(0,0,0,.6)}
.ddial .cap::after{content:"";position:absolute;left:50%;top:1px;width:3px;height:42%;margin-left:-1.5px;background:#fff;border-radius:2px}
.ddial b{position:absolute;font:600 9.5px var(--cond);color:#33393e;transform:translate(-50%,-50%)}
.ddial b.sel{color:#c0392b;font-size:12px}
/* tray + rack */
.tray{background:linear-gradient(#5f6a74,#535d66);border-color:#2f363c;box-shadow:0 5px 0 #2a3036,0 12px 22px rgba(0,0,0,.35);color:#eef1f3}
.tray h2{color:#eef1f3}.tray h2 span{color:#b7c0c7}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.bin{background:#eceae3;border:1px solid #2f363c;border-radius:5px;height:40px;padding:2px;cursor:grab;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#20262b;font:600 11px var(--cond);touch-action:none}
.bin:hover{background:#fff}
.bin svg{display:block;pointer-events:none}
.sw{width:26px;height:22px;border-radius:4px;border:2px solid #20262b;padding:0}
.sw.on{outline:3px solid #ffe14a;outline-offset:1px}
.rackbtn{background:#eceae3;border:1px solid #2f363c;border-radius:5px;padding:4px 8px;font:600 12px var(--cond);color:#20262b;display:flex;align-items:center;gap:6px}
.rackbtn i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #0006}
.rackbtn:hover{background:#fff}

/* side panel */
#panel{width:410px;flex:none;background:var(--paper);border-left:1px solid #1b1e21;display:flex;flex-direction:column;min-height:0}
#panel.closed{display:none}
#tabs{display:flex;background:#e9e5d9;border-bottom:1px solid var(--line)}
#tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:8px 4px;font:600 13px var(--cond);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
#tabs button.on{color:var(--ink);border-bottom-color:var(--accent);background:var(--paper)}
#pbody{flex:1;overflow:auto;padding:12px 14px 30px}
#pbody h3{font:700 18px var(--cond);letter-spacing:.03em;margin:0 0 2px}
#pbody h4{font:700 13px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
#pbody p{margin:4px 0 8px}
.tasks{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
.tasks button{background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 2px;font:600 12px var(--cond);line-height:1.15;color:var(--ink)}
.tasks button small{display:block;font-weight:500;color:var(--muted);font-size:10.5px}
.tasks button.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.steps{display:flex;gap:4px;margin:8px 0;flex-wrap:wrap}
.steps button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:2px 11px;font:600 12px var(--cond)}
.steps button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.wb{background:#fff;border:6px solid #b9b3a2;border-radius:6px;box-shadow:inset 0 0 0 1px #8d8776;margin:6px 0 8px}
.wb svg{display:block;width:100%;height:auto;font-family:var(--hand)}
ol.todo{margin:4px 0 10px;padding-left:20px}ol.todo li{margin:3px 0}
.btn{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:7px 14px;font:600 13px var(--cond);letter-spacing:.05em;text-transform:uppercase}
.btn.alt{background:#fff;color:var(--ink);border:1px solid #b9b3a2}
.btn.sm{padding:3px 9px;font-size:12px}
.msgs{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:5px}
.msgs li{padding:6px 9px 6px 30px;border-radius:5px;position:relative;font-size:13px;background:#fff;border:1px solid var(--line)}
.msgs li::before{position:absolute;left:9px;top:5px;font-weight:700}
.msgs li.ok{border-left:4px solid var(--ok)}.msgs li.ok::before{content:"✓";color:var(--ok)}
.msgs li.bad{border-left:4px solid var(--bad)}.msgs li.bad::before{content:"✗";color:var(--bad)}
.msgs li.na{border-left:4px solid #b9b3a2}.msgs li.na::before{content:"–";color:var(--muted)}
.verdict{font:700 14px var(--cond);letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:5px;display:inline-block;margin-top:8px}
.verdict.ok{background:#dcf2e4;color:#1d6a40}.verdict.bad{background:#f8dfdb;color:#8f2418}
table.obs{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
table.obs th{font:700 11px var(--cond);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:3px 4px;border-bottom:2px solid var(--line)}
table.obs td{padding:2px 4px;border-bottom:1px solid var(--line)}
table.obs input{width:100%;min-width:0;border:1px solid #c9c3b2;border-radius:4px;padding:3px 5px;font:inherit;background:#fff}
table.obs input.cur{border-color:var(--accent);box-shadow:0 0 0 2px rgba(232,134,46,.25)}
table.obs td.st{width:18px;text-align:center;font-weight:700}
table.obs td.num{text-align:right;white-space:nowrap}
.hintbar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.chk li{background:#fff;border:1px solid var(--line);border-radius:5px;padding:6px 9px;display:flex;gap:8px;align-items:flex-start;font-size:13px}
.chk li .pill{flex:none;font:700 11px var(--cond);letter-spacing:.05em;padding:1px 7px;border-radius:9px;background:#e6e2d6;color:var(--muted);margin-top:1px;min-width:44px;text-align:center}
.chk li .pill.ok{background:#dcf2e4;color:#1d6a40}.chk li .pill.bad{background:#f8dfdb;color:#8f2418}
.chk li small{display:block;color:var(--muted)}
kbd{font:600 11px var(--ui);background:#fff;border:1px solid #b9b3a2;border-bottom-width:2px;border-radius:4px;padding:0 5px}
dl.help{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:13px}
dl.help dt{font-weight:600;white-space:nowrap}dl.help dd{margin:0}
.note{background:#fff7e3;border:1px solid #ecd79a;border-radius:5px;padding:6px 9px;font-size:13px;margin:8px 0}
@media (max-width:900px){#panel{position:absolute;right:0;top:0;bottom:0;z-index:30;width:min(410px,92vw);box-shadow:-8px 0 24px rgba(0,0,0,.4)}#main{position:relative}}
@media (prefers-reduced-motion:reduce){.fuse.blown{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <h1>EEE U111 Lab Bench</h1>
    <label>Resistors <select id="optTol"><option value="1">Real (±5 %)</option><option value="0">Ideal (exact)</option></select></label>
    <button id="btnConn" title="Show which breadboard holes are joined (C)">Show connections</button>
    <button id="btnWire" title="Draw jumper wires hole to hole (W)">Wire mode</button>
    <span class="sp"></span>
    <button id="btnClear" title="Remove all parts, jumpers and cables">Clear board</button>
    <button id="btnReset" title="Fresh bench: all instruments back to their start state">Reset bench</button>
    <button id="zOut" aria-label="Zoom out">−</button><button id="zFit">Fit</button><button id="zIn" aria-label="Zoom in">+</button>
    <button id="btnPanel" class="on">Task panel</button>
  </header>
  <div id="main">
    <div id="viewport">
      <div id="sizer"><div id="world"><svg id="wiring" xmlns="http://www.w3.org/2000/svg"></svg></div></div>
    </div>
    <aside id="panel">
      <div id="tabs"><button data-tab="task" class="on">Task</button><button data-tab="chk">Checklist</button><button data-tab="help">Help</button></div>
      <div id="pbody"></div>
    </aside>
    <div id="status"></div>
    <div id="toasts"></div>
  </div>
</div>
<div id="tip"></div>
<script>
/* Lab bench simulation engine: no DOM access, so it runs in the page and in Node tests. */
(function (root) {
'use strict';
const S = {};

/* ───────────── Breadboard geometry (logical) ───────────── */
const COLS = 60;
S.COLS = COLS;
S.ROWS_TOP = ['a', 'b', 'c', 'd', 'e'];
S.ROWS_BOT = ['f', 'g', 'h', 'i', 'j'];
S.RAILS = ['T+', 'T-', 'B+', 'B-'];
function railHasCol(c) { return c >= 2 && c <= 60 && ((c - 2) % 6) !== 5; }

      if (!best || cnt > best.count || (ok && !best.ok)) best = { count: cnt, full, ok, map: Object.assign({}, map), assign: assign.slice() };
      return ok;
    }
    const e = E[i];
    for (let j = 0; j < items.length; j++) {
      const it = items[j];
      if (used[j] || !valOk(e, it) || it.a === it.b) continue;
      for (const [x, y] of [[it.a, it.b], [it.b, it.a]]) {
        const undo = [];
        if (trySet(e.a, x, undo) && trySet(e.b, y, undo)) { used[j] = true; assign[i] = j; if (rec(i + 1, cnt + 1)) return true; used[j] = false; }
        for (const nd of undo) delete map[nd];
      }
    }
    assign[i] = -1;
    return rec(i + 1, cnt);
  }
  rec(0, 0);
  return best;
}
S.matchGraph = matchGraph;

/* sources: returns {ok, msgs, vOk} for a given node map */
function checkSources(expV, topo, map, st) {
  const msgs = []; let ok = true, vOk = true;
  const mapped = new Set(Object.values(map)), usedKeys = new Set();
  for (const e of expV) {
    const P = map[e.p], N = map[e.n];
    let s = topo.sources.find(z => !usedKeys.has(z.key) && z.attached && z.p === P && z.n === N);
    if (s) {
      usedKeys.add(s.key);
      if (Math.abs(s.v - e.v) > 0.1) { vOk = false; msgs.push({ ok: false, text: `${s.name} is set to ${s.v.toFixed(2)} V; ${e.name} should be ${e.v.toFixed(2)} V. Turn COARSE then FINE and confirm with the DMM across the + and − sockets.` }); }
      else msgs.push({ ok: true, text: `${e.name}: ${s.name} at ${s.v.toFixed(2)} V, polarity correct.` });
      continue;
    }
    ok = false;
    s = topo.sources.find(z => z.attached && z.p === N && z.n === P);
    if (s) { msgs.push({ ok: false, text: `${s.name} is connected backwards for ${e.name}: the red (+) lead must go to ${NODE_NAMES[e.p]} and the black (−) lead to ${NODE_NAMES[e.n]}.` }); usedKeys.add(s.key); continue; }
    s = topo.sources.find(z => !usedKeys.has(z.key) && (z.pUsed || z.nUsed) && (z.p === P || z.n === N));
    if (s) { msgs.push({ ok: false, text: `${e.name}: only one lead of ${s.name} reaches the circuit. Red (+) goes to ${NODE_NAMES[e.p]}, black (−) to ${NODE_NAMES[e.n]}.` }); usedKeys.add(s.key); continue; }
    msgs.push({ ok: false, text: `${e.name} (${e.v} V) is not connected: clip a red lead from an RPS + socket to ${NODE_NAMES[e.p]} and a black lead from its − socket to ${NODE_NAMES[e.n]}.` });
  }
  for (const s of topo.sources) {
    if (usedKeys.has(s.key)) continue;
    if (s.attached && s.p === s.n && st.rps.power) { ok = false; msgs.push({ ok: false, text: `${s.name} has its + and − joined together by your wiring: that is a short across a live supply. Unclip the supply first, then put the jumper where it was.` }); continue; }
    if ((s.pUsed && mapped.has(s.p)) || (s.nUsed && mapped.has(s.n))) {
      if (s.key[0] === 'T' && usedKeys.has(s.key === 'Tp' ? 'Tn' : 'Tp')) continue;
      ok = false; msgs.push({ ok: false, text: `${s.name} is still clipped to the circuit but is not part of this step: unclip its leads.` });
    }
  }
  return { ok, vOk, msgs };
}

function meterHints(st, res, topo) {
  const out = [];
  const ammeter = (dev, name, plugSock, comSock, isCur, fuse) => {
    const on = sock => st.leads.some(L => L.ends.some(e => e.t === sock) && L.ends.some(e => e.t && e.t !== sock));
    if (!on(plugSock) || !on(comSock)) return;
    const a = topo.root0(plugSock), b = topo.root0(comSock);
    if (a === b) return;
    const across = topo.items.find(it => (it.a0 === a && it.b0 === b) || (it.a0 === b && it.b0 === a));
    const srcA = topo.sources.find(s => (s.p0 === a && s.n0 === b) || (s.p0 === b && s.n0 === a));
    if (srcA) out.push({ ok: false, text: `${name}: the current input is connected straight across ${srcA.name}. An ammeter is nearly a short circuit${fuse ? '' : ', and its fuse has blown'}. It must go in series with a branch.` });
    else if (across) out.push({ ok: false, text: `${name}: your ammeter is in parallel with ${across.label}. In current mode the meter is almost 0 Ω, so it shorts that component out. Lift one leg into an empty column and bridge the gap with the probes.` });
    if (!isCur) out.push({ ok: false, text: `${name}: the red lead is in the current socket but the function is not a current mode. The current shunt still shorts whatever the probes touch. Move the red lead back to the V/Ω socket for voltage or resistance.` });
  };
  ammeter('hdmm', 'Handheld DMM', 'hdmm:mA', 'hdmm:COM', st.hdmm.dial === 'MA', st.hdmm.fuse);
  ammeter('hdmm', 'Handheld DMM', 'hdmm:A', 'hdmm:COM', st.hdmm.dial === 'A', true);
  ammeter('bdmm', 'Bench DMM', 'bdmm:I', 'bdmm:LO', /DCI|ACI/.test(st.bdmm.func), st.bdmm.fuse);
  if ((st.hdmm.dial === 'MA' && !S.termUsed(st, 'hdmm:mA')) || (st.hdmm.dial === 'A' && !S.termUsed(st, 'hdmm:A'))) out.push({ ok: false, text: 'Handheld DMM: the dial is on current but the red lead is not in the matching current socket, so it reads 0. Move the red plug to mA.' });
  if (/DCI|ACI/.test(st.bdmm.func) && !S.termUsed(st, 'bdmm:I')) out.push({ ok: false, text: 'Bench DMM: DCI is selected but the red lead is not in the I socket, so it reads 0.' });
  if (!st.hdmm.fuse) out.push({ ok: false, text: 'Handheld DMM: the mA fuse is blown, so current reads 0. Click the FUSE cap on the meter to replace it.' });
  if (!st.bdmm.fuse) out.push({ ok: false, text: 'Bench DMM: the current fuse is blown. Click the FUSE cap next to the I socket to replace it.' });
  if (res.hdmm.ohm && res.hdmm.ohm.live) out.push({ ok: false, text: 'Handheld DMM: you are measuring resistance on a powered circuit, so the reading is meaningless. Switch the RPS off and unclip its leads first.' });
  if (res.bdmm.ohm && res.bdmm.ohm.live) out.push({ ok: false, text: 'Bench DMM: resistance mode on a powered circuit gives a meaningless reading. Remove the supply first.' });
  return out;
}
S.meterHints = meterHints;

function wiringHints(topo, items, m, E) {
  const out = [], usedIdx = new Set(m ? m.assign.filter(j => j >= 0) : []);
  if (m) E.forEach((e, i) => { if (m.assign[i] === -1 || m.assign[i] === undefined) out.push({ ok: false, text: `Could not find ${e.name} (${e.kind === 'DRB' ? 'decade box' : fmtR(e.val)}) between ${NODE_NAMES[e.a]} and ${NODE_NAMES[e.b]}.` }); });
  items.forEach((it, j) => {
    if (usedIdx.has(j) || it.kind === 'POT') return;
    const ca = topo.count.get(it.a) || 0, cb = topo.count.get(it.b) || 0;
    if (it.a === it.b) {
      if (it.a0 === it.b0) out.push({ ok: false, text: `Both legs of ${it.label} are in the same connected strip (${netName(topo, it.a)}), so it is shorted out and does nothing. Put its legs in two different columns.` });
      else out.push({ ok: false, text: `${it.label[0].toUpperCase() + it.label.slice(1)} is shorted by a meter in current mode connected across it.` });
    } else if (ca <= 1 || cb <= 1) {
      const leg = it.part ? it.part.legs[ca <= 1 ? 0 : 1] : '';
      out.push({ ok: false, text: `One end of ${it.label}${leg ? ' (hole ' + leg + ')' : ''} sits in a strip with nothing else connected, so no current can flow through it.` });
    } else if (m) out.push({ ok: false, text: `${it.label[0].toUpperCase() + it.label.slice(1)} connects ${netName(topo, it.a, m.map)} to ${netName(topo, it.b, m.map)}, which does not match the diagram.` });
  });
  // rail split
  for (const rl of ['T+', 'T-', 'B+', 'B-']) {
    const l = topo.uf.find('r' + rl + 'L'), r = topo.uf.find('r' + rl + 'R');
    if (l !== r && (topo.count.get(l) || 0) >= 1 && (topo.count.get(r) || 0) >= 1 && ((topo.count.get(l) || 0) === 1 || (topo.count.get(r) || 0) === 1))
      out.push({ ok: false, text: `The ${rl[0] === 'T' ? 'top' : 'bottom'} ${rl[1] === '+' ? '+' : '−'} power rail is split in the middle (between columns 30 and 32). Parts on the left half are not connected to parts on the right half unless you bridge the gap with a jumper.` });
  }
  return out;
}

/* generic resistive-network wiring check */
function checkNetwork(st, res, spec, anchors) {
  const topo = S.topology(st), msgs = [];
  const E = spec.R, expV = spec.V || [];
  const act = topo.items.filter(it => it.kind !== 'POT');
  let m = matchGraph(E, act, anchors, map => { const c = checkSources(expV, topo, map, st); return c.ok && c.vOk; });
  if (!m || !m.ok) { const m2 = matchGraph(E, act, anchors, map => checkSources(expV, topo, map, st).ok); if (m2 && (m2.ok || !m || m2.count > m.count)) m = m2; }
  let ok = false;
  if (m && m.full) {
    const extra = act.filter((it, j) => !m.assign.includes(j) && it.a !== it.b && Object.values(m.map).includes(it.a) && Object.values(m.map).includes(it.b));
    const sc = checkSources(expV, topo, m.map, st);
    if (extra.length) extra.forEach(it => msgs.push({ ok: false, text: `Extra component: ${it.label} is connected between ${netName(topo, it.a, m.map)} and ${netName(topo, it.b, m.map)}. It is not in this step's circuit: remove it.` }));
    else msgs.push({ ok: true, text: `Resistor network matches the diagram (${E.map(e => e.name).join(', ')}).` });
    msgs.push(...sc.msgs);
    ok = !extra.length && sc.ok && sc.vOk;
    if (ok && expV.length && !st.rps.power) msgs.push({ ok: true, text: 'Wiring is right. The RPS is off: switch it on to take readings.', note: true });
    if (spec.half) { const j = m.assign[spec.half.i]; if (j >= 0 && !act[j].half) msgs.push({ ok: false, text: `${spec.half.name} must be the ½ W 100 Ω resistor (the larger one). A ¼ W part overheats here.` }); }
  } else {
    msgs.push({ ok: false, text: 'The resistor network does not match the diagram yet.' });
    msgs.push(...wiringHints(topo, act, m, E));
    if (m && m.count > 0) { const sc = checkSources(expV, topo, m.map, st); sc.msgs.filter(z => !z.ok).forEach(z => msgs.push(z)); }
  }
  msgs.push(...meterHints(st, res, topo));
  return { ok, msgs, map: m ? m.map : null, topo };
}
S.checkNetwork = checkNetwork;

U.fmtEng = function (v, unit, dig) {

  for (const [m, p] of P) if (a >= m * 0.9995) return (v / m).toPrecision(dig) + p + unit;

const UNITK = { V: 1, mA: 1e-3, 'kΩ': 1e3, 'Ω': 1, mW: 1e-3, '°': 1, 'µs': 1e-6, kHz: 1e3, Hz: 1 };
const task = () => S.taskById(st().ui.mode), stepOf = t => t.steps[Math.min(st().ui.step, t.steps.length - 1)];
const okey = (t, s, k) => t.id + '.' + s.id + '.' + k;
function valsFor(t, s) { const o = {}; for (const r of s.rows) o[r.k] = st().ui.obs[okey(t, s, r.k)]; return o; }
const num = v => { const x = parseFloat(String(v === undefined ? '' : v).replace(',', '.')); return isFinite(x) ? x : null; };
function msgList(msgs) { return `<ul class="msgs">${msgs.map(m => `<li class="${m.ok === null ? 'na' : m.note ? 'na' : m.ok ? 'ok' : 'bad'}">${esc(m.text)}</li>`).join('')}</ul>`; }
function sumsHTML(t, s) {
  if (!s.sums) return '';
  const all = {}; for (const z of t.steps) for (const r of z.rows) all[r.k] = num(st().ui.obs[okey(t, z, r.k)]);
  return `<h4>Computed from your readings</h4><table class="obs">${s.sums.map(([label, terms, unit]) => { let v = 0, ok = true; for (const term of terms) { const neg = term[0] === '-', x = all[neg ? term.slice(1) : term]; if (x === null || x === undefined) ok = false; else v += neg ? -Math.abs(x) : Math.abs(x); } return `<tr><td>${esc(label)}</td><td class="num">${ok ? v.toFixed(3) + ' ' + unit : '–'}</td></tr>`; }).join('')}</table>`;
}
function mptHTML() {
  const rows = st().ui.mpt.slice().sort((a, b) => a.r - b.r);
  let h = `<h4>Sweep table</h4><div class="hintbar"><button class="btn sm" data-act="mptRec">Record row from the meters</button><button class="btn alt sm" data-act="mptClr">Clear table</button></div>`;
  if (U.check.note) h += `<div class="note">${esc(U.check.note)}</div>`;
  if (!rows.length) return h + '<p>No rows yet. Set the decade box, read both meters, then press Record row.</p>';
  let best = rows[0];
  rows.forEach(r => { r.p = r.v * r.i; if (r.p > best.v * best.i) best = r; });
  h += `<table class="obs"><tr><th>R_L (Ω)</th><th>I_L (mA)</th><th>V_L (V)</th><th>P = V·I (mW)</th><th></th></tr>${rows.map(r => `<tr${r === best ? ' style="background:#fff3d6"' : ''}><td class="num">${r.r}</td><td class="num">${r.i.toFixed(2)}</td><td class="num">${r.v.toFixed(3)}</td><td class="num">${r.p.toFixed(1)}</td><td class="st"><button class="btn alt sm" data-act="mptDel" data-r="${r.r}" aria-label="Delete row">×</button></td></tr>`).join('')}</table>`;
  // plot
  const PW = 360, PH = 190, L = 42, B = 28, xm = Math.max.apply(null, rows.map(r => r.r)) * 1.05 || 1, ym = Math.max(best.v * best.i * 1.15, 1);
  const X = r => L + (PW - L - 8) * r / xm, Y = p => PH - B - (PH - B - 10) * p / ym;
  const nice = m => { const e = Math.pow(10, Math.floor(Math.log10(m / 4))), f = m / 4 / e; return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * e; };
  let g = '';
  for (let v = 0, s2 = nice(ym); v <= ym; v += s2) g += `<line x1="${L}" x2="${PW - 8}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e3dfd2"/><text x="${L - 5}" y="${Y(v) + 4}" font-size="10" text-anchor="end" fill="#69737b">${+v.toPrecision(3)}</text>`;
  for (let v = 0, s2 = nice(xm); v <= xm; v += s2) g += `<text x="${X(v)}" y="${PH - B + 13}" font-size="10" text-anchor="middle" fill="#69737b">${+v.toPrecision(3)}</text>`;

  g += `<text x="${X(best.r)}" y="${Y(best.p) - 9}" font-size="11" font-weight="700" text-anchor="middle" fill="#c0392b">${best.p.toFixed(0)} mW at ${best.r} Ω</text>`;
  g += `<line x1="${L}" x2="${PW - 8}" y1="${PH - B}" y2="${PH - B}" stroke="#69737b"/><line x1="${L}" x2="${L}" y1="10" y2="${PH - B}" stroke="#69737b"/><text x="${(PW + L) / 2}" y="${PH - 2}" font-size="11" text-anchor="middle" fill="#1c2328">R_L (Ω)</text><text x="11" y="${(PH - B) / 2 + 5}" font-size="11" text-anchor="middle" fill="#1c2328" transform="rotate(-90 11 ${(PH - B) / 2 + 5})">P (mW)</text>`;
  return h + `<h4>P against R_L</h4><svg viewBox="0 0 ${PW} ${PH}" style="width:100%;background:#fff;border:1px solid var(--line);border-radius:5px" role="img" aria-label="Plot of load power against load resistance">${g}</svg><p>Highest power so far: <b>${(best.v * best.i).toFixed(1)} mW at R_L = ${best.r} Ω</b>. Theory: 160 mW at 100 Ω (R_L = R_TH).</p>`;
}

  ${man('probe', 'Scope probe setting matches the cable', '1X for BNC–crocodile and BNC–BNC cables, 10X for the 10X probe.')}
  ${man('units', 'Units and signs written with every reading', 'mA, V, kΩ: and a diagram with meter positions.')}
  ${man('off', 'At the end: supply off, knobs to minimum, cables back', 'DMM dial to OFF, red lead in VΩ.')}
  </ul><div class="hintbar"><button class="btn alt sm" data-act="chkReset">Start the checklist again</button></div>`;
}
function helpHTML() {
  return `<h3>How to use the bench</h3><dl class="help">
  <dt>Knobs</dt><dd>Drag around the knob, or point at it and scroll. <kbd>Shift</kbd> + scroll moves 10× faster. Arrow keys work once a knob is clicked.</dd>
  <dt>Parts</dt><dd>Drag from the Components tray onto the board. Drag a leg to stretch it to another hole. Drag the body to move the part.</dd>
  <dt>Remove</dt><dd>Right-click a part, or either end of a cable. Or click it and press <kbd>Delete</kbd>. Parts can also be dragged off the board.</dd>
  <dt>Jumpers</dt><dd>Press <kbd>W</kbd> (or pick a colour), then drag from one hole to another. <kbd>Esc</kbd> leaves wire mode.</dd>
  <dt>Cables</dt><dd>Click a cable in the rack. Drag each end onto a socket, or onto a hole (the clip grabs a wire or a leg in that strip).</dd>
  <dt>Meter leads</dt><dd>The DMM leads are already plugged in. Drag the probe tips onto holes. To measure current, drag the red <i>plug</i> from VΩ to mA.</dd>
  <dt>741</dt><dd>Double-click to turn it round. Hover a pin for its name. The notch marks the pin 1 end.</dd>
  <dt>Connections</dt><dd><kbd>C</kbd> shows which holes are joined inside the board.</dd>
  <dt>Zoom</dt><dd><kbd>+</kbd> <kbd>−</kbd> keys or the bar buttons. <kbd>F</kbd> fits the bench to the window.</dd></dl>
  <h4>Instrument notes</h4><dl class="help">
  <dt>Supply</dt><dd>Voltage = COARSE + FINE. Tracking channel gives +V, 0 and −V together for the op-amp.</dd>
  <dt>Handheld DMM</dt><dd>Click a dial position. RANGE steps manual ranges, HOLD freezes the display. Click the FUSE cap to replace a blown fuse.</dd>
  <dt>Bench DMM</dt><dd>Shift then DCV gives DC current (red lead to the I socket). Range toggles manual; + and − step the range.</dd>
  <dt>Decade box</dt><dd>Click a number or scroll a dial. Value is the sum of all five dials.</dd>
  <dt>Function generator</dt><dd>Press a soft key (F1–F5) to pick a parameter, type the number, then press the unit soft key. Or turn the knob; ◀ ▶ change the step. The CH1/CH2 output buttons must be lit.</dd>
  <dt>Scope</dt><dd>Autoset finds the signal. Menu 1 / Menu 2 open the channel menu (coupling, probe). Measure: choose source and type, then Add. Cursor: choose the type, then turn Multipurpose.</dd></dl>
  <div class="note">Each new resistor gets a random actual value within ±5 %, as real parts do, so readings land near the theory rather than on it. Switch “Resistors” to Ideal in the top bar to get the textbook numbers exactly.</div>`;
}
U.renderPanel = function () {
  const ui = st().ui, body = $('#pbody'), top = body.scrollTop;
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
  body.innerHTML = ui.tab === 'task' ? taskHTML() : ui.tab === 'chk' ? chkHTML() : helpHTML();
  body.scrollTop = top;
  $('#panel').classList.toggle('closed', !ui.panel); $('#btnPanel').classList.toggle('on', ui.panel);
};
function fill(val, what) {
  const t = task(); if (!t) return;
  const s = stepOf(t), r = s.rows.find(z => z.k === U.curRow);
  if (!r) { U.check.note = 'Click the row you want to fill first, then press the button.'; return; }
  if (val === null || !isFinite(val)) { U.check.note = what + ' has no valid reading to copy (off, overload, or not connected).'; return; }
  const k = UNITK[r.unit] || 1; st().ui.obs[okey(t, s, r.k)] = String(+(val / k).toPrecision(5)); U.check.note = '';
}
function scopeVal(k) {
  const M = U.capMeas && U.capMeas(), d = st().dso; if (!M) return null;
  if (k === 'Vin' || k === 'Vpp') return M[0]['Pk-Pk'];
  if (k === 'Vout' || k === 'Vmax') return M[1]['Pk-Pk'];
  if (k === 'f') return M[0].Freq; if (k === 'rms') return M[0].RMS; if (k === 'max') return M[0].Max; if (k === 'min') return M[0].Min;
  if (k === 'dt') return d.cursor.type === 'time' ? Math.abs(d.cursor.t[1] - d.cursor.t[0]) * d.tdiv : null;
  return null;
}
U.bindPanel = function () {
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { st().ui.tab = b.dataset.tab; U.renderPanel(); U.save(); } });
  const body = $('#pbody');
  body.addEventListener('focusin', e => { const i = e.target.closest('[data-obs]'); if (i) { U.curRow = i.dataset.obs; $$('input.cur', body).forEach(x => x.classList.remove('cur')); i.classList.add('cur'); } });
  body.addEventListener('input', e => {
    const i = e.target, ui = st().ui, t = task();
    if (i.dataset.obs && t) ui.obs[okey(t, stepOf(t), i.dataset.obs)] = i.value;
    else if (i.dataset.free) { const [n, k] = i.dataset.free.split('.'); ui.free[+n][k] = i.value; }
    U.save();
  });
  body.addEventListener('change', e => {
    const i = e.target, ui = st().ui;
    if (i.dataset.man) { ui.chkManual[i.dataset.man] = i.checked; U.renderPanel(); }
    else if (i.dataset.act === 'exp') { ui.showExp = i.checked; U.renderPanel(); }
    U.save();
  });
  body.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const s = st(), ui = s.ui, t = task(), ck = U.check;
    if (b.dataset.mode) { ui.mode = b.dataset.mode; ui.step = 0; U.check = { wiring: null, readings: null, bench: null, note: '' }; U.curRow = null; body.scrollTop = 0; }
    else if (b.dataset.step !== undefined) { ui.step = +b.dataset.step; U.check = { wiring: null, readings: null, bench: null, note: '' }; U.curRow = null; }
    else {
      const a = b.dataset.act, res = U.res;
      if (a === 'wiring' && t && res) { try { ck.wiring = S.checkStep(s, res, t, stepOf(t)); } catch (err) { ck.wiring = { ok: false, msgs: [{ ok: false, text: 'Could not analyse this wiring: ' + err.message }] }; } }
      else if (a === 'readings' && t) ck.readings = S.checkReadings(s, stepOf(t), valsFor(t, stepOf(t)));
      else if (a === 'fillH') fill(U.hRead && !U.hRead.off && !U.hRead.ol && !U.hRead.live ? U.hRead.value : null, 'The handheld DMM');
      else if (a === 'fillB') fill(U.bRead && !U.bRead.off && !U.bRead.ol && !U.bRead.live ? U.bRead.value : null, 'The bench DMM');
      else if (a === 'fillS') { const v = scopeVal(U.curRow); if (U.curRow === 'ph') ck.note = 'Work the phase out yourself: Δt ÷ T × 360°, or look at whether the output is upside down.'; else fill(v, 'The scope'); }
      else if (a === 'bench' && res) { const topo = S.topology(s), m = S.meterHints(s, res, topo); topo.items.forEach(it => { if (it.a === it.b && it.a0 === it.b0) m.push({ ok: false, text: `Both ends of ${it.label} are in the same connected strip, so it is shorted out.` }); }); ck.bench = m.length ? m : [{ ok: true, text: 'No obvious mistakes: no shorted parts, meters connected sensibly.' }]; }
      else if (a === 'freeAdd') ui.free.push({ q: '', th: '', me: '', u: '' });
      else if (a === 'freeClr') ui.free = [0, 1, 2].map(() => ({ q: '', th: '', me: '', u: '' }));
      else if (a === 'mptClr') { ui.mpt = []; ck.note = ''; }
      else if (a === 'mptDel') ui.mpt = ui.mpt.filter(r => r.r !== +b.dataset.r);
      else if (a === 'mptRec' && res) {
        const h = U.hRead || {}, m = U.bRead || {}; let I = null, V = null;
        const good = d => !d.off && !d.ol && !d.live && isFinite(d.value);
        if (/^(MA|A)$/.test(s.hdmm.dial) && good(h)) I = h.value; else if (s.hdmm.dial === 'VDC' && good(h)) V = h.value;
        if (s.bdmm.func === 'DCI' && good(m) && I === null) I = m.value; else if (s.bdmm.func === 'DCV' && good(m) && V === null) V = m.value;
        if (I === null || V === null) ck.note = 'To record a row you need one meter on DC current in series with the decade box and the other on DC volts across it. Right now ' + (I === null ? 'no meter is reading current' : 'no meter is reading voltage') + '.';
        else { const r = S.drbValue(s); ui.mpt = ui.mpt.filter(z => z.r !== r); ui.mpt.push({ r, i: Math.abs(I) * 1e3, v: Math.abs(V) }); ck.note = ''; }
      } else if (a === 'chkReset') { s.chk = U.fresh().chk; ui.chkManual = {}; }
    }
    U.renderPanel(); U.save();
  });
};
})();

</script>
<script>
/* Boot, main loop, toolbar, keyboard */
(function () {
'use strict';
const S = window.Sim, U = window.U, $ = U.$, clamp = U.clamp;
const st = () => U.state;
let redPrev = false, lastT = 0, lastScope = 0, lastFlick = 0;

function solve() {
  const s = st(); let res;
  try { res = S.settle(s); } catch (e) { console.error(e); U.setStatus('Solver error: ' + e.message); return; }
  U.res = res; const c = s.chk;
  for (const ev of res.log) {
    if (ev.type === 'fuse') {
      c.fuses = (c.fuses || 0) + 1;
      U.toast('', 'Fuse blown: ' + (ev.dev === 'hdmm' ? 'handheld DMM' : 'bench DMM'), 'The meter was in current mode across a voltage (in parallel instead of in series), so a large current went through it. It now reads 0. Fix the connection, then click the FUSE cap on the meter to replace it.', 'bad', 14000);
    } else if (ev.type === 'burn') {
      c.burns = (c.burns || 0) + 1; U.sparks['ic' + ev.id] = true; setTimeout(() => { delete U.sparks['ic' + ev.id]; U.wdirty = true; }, 7000);
      U.toast('', '741 destroyed', 'The supply was reversed on pins 4 and 7 (pin 7 must be +V, pin 4 must be −V). Drag the burnt IC off the board and take a new one.', 'bad', 14000);
    }
    U.wdirty = true; U.pdirty = true;
  }
  // habits the checklist tracks
  if (s.rps.power) {
    const f = x => res.ckt.uf.find(S.termNet(x));
    const across = (a, b, k) => (f(a) === f('rps:' + k + '+') && f(b) === f('rps:' + k + '-')) || (f(b) === f('rps:' + k + '+') && f(a) === f('rps:' + k + '-'));
    for (const k of ['A', 'B']) {
      if (c.confirmed[k]) continue;
      if ((s.hdmm.dial === 'VDC' && across('hdmm:V', 'hdmm:COM', k)) || (s.bdmm.power && s.bdmm.func === 'DCV' && across('bdmm:HI', 'bdmm:LO', k))) { c.confirmed[k] = true; U.pdirty = true; }
    }
  }
  const dl = s.leads.filter(L => L.kind === 'dmm'), red = dl[0], blk = dl[1];
  const redNow = !!(red && blk && /hdmm:(mA|A)/.test(red.ends[0].t || '') && red.ends[1].t && blk.ends[1].t && !/^(MA|A|OFF)$/.test(s.hdmm.dial));
  if (redNow && !redPrev) { c.redLead++; U.pdirty = true; U.toast('redlead', 'Red lead is still in the current socket', 'The dial is not on a current range but the red plug is in mA/A. The meter is nearly a short circuit there. Move the red plug back to VΩ.', 'bad'); }
  redPrev = redNow;
  U.updInst(res);
  U.save();
}
function thermal(dt) {
  const s = st(), res = U.res; if (!res) return;
  let redraw = false;
  for (const p of s.parts) {
    if (p.type !== 'R') continue;
    const r = res.parts.get(p.id), rating = p.half ? 0.5 : 0.25, ratio = r && !p.burnt ? r.p / rating : 0;
    let acc = U.heatAcc[p.id] || 0;
    if (ratio > 1.02) {
      acc += dt * Math.min(5, ratio - 0.6);
      U.toast('hot' + p.id, 'Resistor overheating', `${S.fmtR(p.nominal)} at ${p.legs[0]}–${p.legs[1]} is dissipating ${(r.p * 1000).toFixed(0)} mW but is rated ${rating * 1000} mW. Switch off or it will burn.`, 'bad');
    } else acc = Math.max(0, acc - dt * 0.6);
    if (acc >= 4 && !p.burnt) { p.burnt = true; s.chk.burns = (s.chk.burns || 0) + 1; U.pdirty = true; U.toast('', 'Resistor burnt out', `The ${S.fmtR(p.nominal)} resistor is now open circuit. Right-click it to remove it, and work out why it carried so much current.`, 'bad', 12000); U.touch(true); }
    const h = Math.round(clamp(acc / 4, 0, 1) * 6) / 6;
    if (h !== (U.heat[p.id] || 0)) { U.heat[p.id] = h; redraw = true; }
    if (acc > 0) U.heatAcc[p.id] = acc; else delete U.heatAcc[p.id];
  }
  if (redraw) U.wdirty = true;
}
function tick(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000 || 0); lastT = now;
  try {
    if (U.dirty) { U.dirty = false; solve(); }
    thermal(dt);
    if (U.res && now - lastFlick > 350) { lastFlick = now; if ((U.hRead && U.hRead.live) || (U.bRead && U.bRead.live)) U.updMeters(U.res); }
    if (U.wdirty) { U.wdirty = false; U.renderWiring(); }
    if (U.pdirty) { U.pdirty = false; if (st().ui.tab === 'chk') U.renderPanel(); }
    if (now - lastScope > 66 && !document.hidden) { lastScope = now; U.scopeFrame(); }
  } catch (e) { console.error(e); }
  requestAnimationFrame(tick);
}

/* zoom */
function setScale(v) {
  U.scale = clamp(v, 0.35, 2.2);
  $('#world').style.transform = `scale(${U.scale})`;
  $('#sizer').style.width = U.WORLD.w * U.scale + 'px'; $('#sizer').style.height = U.WORLD.h * U.scale + 'px';
}
function fit() { const v = $('#viewport'); setScale(Math.max(0.5, Math.min((v.clientWidth - 4) / U.WORLD.w, 1.4))); }

function boot() {
  U.buildBench(); U.initWiring(); U.bindInstruments(); U.bindPanel();
  const s = st();
  $('#optTol').value = s.opts.tolerance ? '1' : '0';
  $('#optTol').addEventListener('change', e => { st().opts.tolerance = e.target.value === '1'; U.touch(); });
  const conn = () => { $('#btnConn').classList.toggle('on', st().ui.conn); $('#btnConn').textContent = st().ui.conn ? 'Hide connections' : 'Show connections'; U.wdirty = true; U.save(); };
  $('#btnConn').addEventListener('click', () => { st().ui.conn = !st().ui.conn; conn(); });
  $('#btnWire').addEventListener('click', () => U.setWire(st().ui.wire ? null : (U.lastWire || U.WIRECOL[0])));
  $('#btnClear').addEventListener('click', () => { U.clearBoard(); U.toast('', 'Board cleared', 'All parts, jumpers and cables removed. Instrument settings are unchanged.', '', 4000); });
  let armed = 0;
  $('#btnReset').addEventListener('click', e => {
    const b = e.currentTarget;
    if (Date.now() - armed > 3500) { armed = Date.now(); b.textContent = 'Click again to reset'; b.classList.add('on'); setTimeout(() => { b.textContent = 'Reset bench'; b.classList.remove('on'); }, 3500); return; }
    armed = 0; const ui = st().ui, keep = { mode: ui.mode, step: ui.step, tab: ui.tab, panel: ui.panel, obs: ui.obs, mpt: ui.mpt, free: ui.free, showExp: ui.showExp };
    U.state = U.fresh(); Object.assign(U.state.ui, keep); U.heat = {}; U.heatAcc = {}; U.sparks = {}; U.sel = null; U.cap = null; U.held = null;
    $('#optTol').value = '1'; U.syncKnobs(); U.setWire(null); conn(); U.renderPanel(); U.touch(true);
  });
  $('#zIn').addEventListener('click', () => setScale(U.scale * 1.15));
  $('#zOut').addEventListener('click', () => setScale(U.scale / 1.15));
  $('#zFit').addEventListener('click', fit);
  $('#btnPanel').addEventListener('click', () => { st().ui.panel = !st().ui.panel; U.renderPanel(); fit(); U.wdirty = true; U.save(); });
  document.addEventListener('pointerdown', () => U.audioInit(), { once: true });
  document.addEventListener('keydown', e => {
    if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'w') U.setWire(st().ui.wire ? null : (U.lastWire || U.WIRECOL[0]));
    else if (k === 'c') { st().ui.conn = !st().ui.conn; conn(); }
    else if (k === 'f') fit();
    else if (k === '+' || k === '=') setScale(U.scale * 1.15);
    else if (k === '-' || k === '_') setScale(U.scale / 1.15);
    else if (k === 'escape') { if (st().ui.wire) U.setWire(null); U.sel = null; U.wdirty = true; }
    else if ((k === 'delete' || k === 'backspace') && U.sel && !e.target.closest('.knob,.ddial,#hDial')) { e.preventDefault(); U.removeItem(U.sel.type, U.sel.id); }
  });
  const sw = U.setWire; U.setWire = c => { if (c) U.lastWire = c; sw(c); };
  U.syncKnobs(); U.setWire(s.ui.wire || null); conn(); U.renderPanel(); fit();
  const relayout = () => { U.clearTerms(); U.wdirty = true; };
  window.addEventListener('resize', () => { relayout(); });
  window.addEventListener('load', relayout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { relayout(); U.drawFg(); });
  U.touch(true);
  requestAnimationFrame(tick);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
